# Example config: http-client backend.
# The SDK does NOT start any model here; it calls an already-running
# OpenAI-compatible endpoint (vLLM / llama.cpp server / the bundled HF server).
#
# Fill in the two model/asset paths and the server URL, then run:
#   ocrcpm run --config example_http_client.yaml
run:
  run_tag: example_http_client
  run_root: ./runs
  mode: full
  seed: 42

input:
  # Provide exactly one of file_path / image_dir / files_dir.
  file_path: /abs/path/to/page.png
  # image_dir: /abs/path/to/images
  limit: 0

layout:
  enabled: true
  provider: ppdoclayout3
  # PP-DocLayoutV3 model directory (HF safetensors format).
  model_dir: /abs/path/to/PP-DocLayoutV3_safetensors
  device: cpu

engine:
  # MiniCPM-V OCR model directory (only required for the vllm auto-start backend;
  # for the http-client backend the server already holds the weights).
  model_path: /abs/path/to/ocr_minicpmv_model
  # http-client backend: point at one or more OpenAI-compatible endpoints.
  server_urls:
    - http://127.0.0.1:18599
  request_timeout_sec: 600
  request_ready_timeout_sec: 900

pipeline:
  max_workers: 1        # crop-level concurrency
  page_workers: 1       # page-level concurrency
  queue_mode: serial

mm:
  image_limit: 1
  max_slice_nums: 9
  downsample_mode: 4x
