# Example config: Ollama backend (SDK auto-starts `ollama serve` and registers
# the model from the two GGUF files on first run).
run:
  run_tag: example_ollama_local
  run_root: ./runs
  mode: full
  seed: 42

input:
  file_path: /abs/path/to/page.png
  limit: 0

layout:
  enabled: true
  provider: ppdoclayout3
  model_dir: /abs/path/to/PP-DocLayoutV3_safetensors
  device: cpu

engine:
  type: minicpm_ollama_api
  model_name: minicpm-v4.7
  # Leave model_path / mmproj_path empty if the model is already registered in Ollama.
  model_path: /abs/path/to/model-f16.gguf
  mmproj_path: /abs/path/to/mmproj-f16.gguf
  # Empty means the `ollama` binary is looked up on PATH.
  ollama_bin: ''
  ollama_models_dir: ''
  auto_start: true
  host: 127.0.0.1
  port: 11434
  gpu_id: "0"
  gpu_layers: 99
  parallel: 1
  keep_alive: 30m
  max_model_len: 8192
  startup_timeout_sec: 1800
  wait_ready: true
  request_timeout_sec: 600
  request_ready_timeout_sec: 900

pipeline:
  max_workers: 1
  page_workers: 1
  queue_mode: serial

mm:
  image_limit: 1
  max_slice_nums: 9
  downsample_mode: 4x

decode:
  temperature: 0
  top_p: 1
  top_k: 1
  repetition_penalty: 1.1
  no_repeat_ngram_size: 0
